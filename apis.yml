aid: iontra
name: Iontra
description: 'Iontra Inc. is a Denver, Colorado battery technology company that develops
  proprietary Charge-Control technology for rechargeable lithium batteries. Founded in
  2013 and publicly launched in 2022, Iontra applies electrodynamic sensing and signal
  processing during charging to suppress lithium plating, dendrite growth and SEI-layer
  expansion, claiming up to 4x cycle life, 2x faster charging, improved cold-weather
  charging and better safety without changing cell chemistry. The technology is chemistry
  agnostic across Li-ion, Li-metal, Li-S, solid-state and Na-ion cells, and is delivered
  to OEMs as custom charging algorithm "recipes" flashed onto an application-specific
  microcontroller, or as a software-only library. Iontra closed a $45M Series C led by
  Volta Energy Technologies to launch an integrated RISC-V charge-control and fuel-gauge
  MCU. Iontra is an embedded/silicon company: it publishes no public web API, no OpenAPI,
  and no public SDK packages — its SDK is firmware delivered to OEM customers through a
  login-gated Document Portal under commercial engagement.'
